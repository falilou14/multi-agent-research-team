name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances (dev)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      # -m "not integration" : exclut les tests qui appellent de vraies API
      # (Tavily/Gemini/LangSmith) -- coûteux, lents, et sujets aux pannes
      # 503 déjà rencontrées sur le projet précédent. Ces tests restent
      # disponibles en local via `pytest -m integration`, jamais en CI.
      - name: Tests (unitaires, sans vraie API)
        run: pytest -m "not integration" --cov=src --cov-report=term-missing
